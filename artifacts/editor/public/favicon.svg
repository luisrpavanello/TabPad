<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#38322e"/>

  <!-- Main paper (bigger, more filled) -->
  <rect x="90" y="120" width="332" height="300" rx="28" fill="#f5f5f5"/>

  <!-- Tabs (bigger and more centered visually) -->
  <rect x="120" y="80" width="90" height="55" rx="14" fill="#f59e0b"/>
  <rect x="210" y="80" width="90" height="55" rx="14" fill="#fbbf24"/>
  <rect x="300" y="80" width="90" height="55" rx="14" fill="#9ca3af"/>

  <!-- Pencil (larger + more dominant) -->
  <g transform="translate(320,250) rotate(35)">
    <rect x="-20" y="-40" width="50" height="180" rx="10" fill="#f59e0b"/>
    <rect x="-20" y="-40" width="50" height="25" rx="8" fill="#fbbf24"/>
    <polygon points="-20,140 30,140 5,175" fill="#ffffff"/>
  </g>

  <!-- subtle inner shadow hint (depth) -->
  <rect x="90" y="120" width="332" height="300" rx="28" fill="none" stroke="rgba(0,0,0,0.08)"/>
</svg>